# Dev overrides: mount source for hot-reload, expose extra ports
services:
  app:
    build:
      target: builder
    command:
      - uvicorn
      - poly_orchestrator.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --reload
    volumes:
      - ./src:/app/src:ro
    environment:
      APP_ENV: development
      APP_LOG_LEVEL: DEBUG
