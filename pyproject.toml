[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "poly-orchestrator"
version = "0.1.0"
description = "AI Visibility Orchestrator — fan-out brand-mention queries across multiple LLM providers and surface actionable metrics"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Abraham Ayamigah", email = "abraham.ayamigah@amalitechtraining.org" }]
keywords = ["ai", "llm", "orchestrator", "brand-monitoring", "visibility"]

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # Async HTTP
    "httpx>=0.27.0",
    # Validation & settings
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    # Cache
    "redis[hiredis]>=5.0.0",
    # AI SDKs
    "openai>=1.40.0",
    "anthropic>=0.34.0",
    "google-generativeai>=0.7.0",
    # Observability
    "prometheus-client>=0.21.0",
    "structlog>=24.4.0",
    # Utilities
    "tenacity>=9.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "bandit[toml]>=1.7.10",
    "pre-commit>=3.8.0",
    "factory-boy>=3.3.0",
]

[project.scripts]
poly-orchestrator = "poly_orchestrator.main:start"

[tool.hatch.build.targets.wheel]
packages = ["src/poly_orchestrator"]

# ── Ruff (linter + formatter) ─────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # flake8-bugbear
    "C4",       # flake8-comprehensions
    "UP",       # pyupgrade
    "S",        # flake8-bandit
    "PT",       # flake8-pytest-style
    "RUF",      # ruff-specific
]
ignore = ["S101", "S603", "S607"]  # assert in tests, subprocess (used carefully)

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PT"]
"migrations/**" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["poly_orchestrator"]

# ── Mypy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

# ── Bandit (SAST) ─────────────────────────────────────────────────────────────
[tool.bandit]
targets = ["src"]
skips = ["B101", "B601"]

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
    "--cov=poly_orchestrator",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-fail-under=80",
    "-v",
]

# ── Coverage ──────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["src/poly_orchestrator"]
omit = ["*/migrations/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
